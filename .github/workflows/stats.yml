name: Generate Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Lang Stats
        uses: anuraghazra/github-readme-stats@master
        with:
          username: nurmhm
          show_icons: true
          layout: compact

      - name: Save SVG
        run: |
          mkdir -p output
          curl "https://github-readme-stats.vercel.app/api/top-langs/?username=nurmhm&layout=compact" > output/stats_langs.svg

      - name: Commit
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "update stats" || echo "no changes"
          git push